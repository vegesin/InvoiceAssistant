name: 功能建议
description: 说明实际报销场景及希望减少的操作。
body:
  - type: textarea
    id: scenario
    attributes:
      label: 当前场景和遇到的困难
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望如何操作，完成后得到什么结果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方法或补充说明
      description: 请使用虚构例子，不要提交个人报销资料。
